<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Freud WebAR</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
      AFRAME.registerComponent('play-audio', {
        init: function () {
          let audio = new Audio('freud_intro.mp3');
          this.el.addEventListener('click', function () {
            audio.currentTime = 0;
            audio.play();
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="patternRatio: 0.8;" vr-mode-ui="enabled: false">
      <a-marker type="pattern" url="marker.patt">
        <a-image
          src="freud.png"
          position="0 0 0"
          rotation="-90 0 0"
          width="1"
          height="1"
          class="clickable"
          play-audio>
        </a-image>
      </a-marker>
      <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-scene>
  </body>
</html>
