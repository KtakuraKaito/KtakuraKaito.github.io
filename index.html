<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Psychology RPG WebAR</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      #status-bar {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        border: 2px solid #fff;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: bold;
        z-index: 9999;
        text-align: center;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        white-space: nowrap;
      }

      #command-panel {
        position: fixed;
        right: 12px;
        top: 45%;
        transform: translateY(-50%);
        display: none;
        flex-direction: column;
        gap: 14px;
        z-index: 9999;
        width: 48%;
        max-width: 220px;
      }

      .cmd-btn {
        width: 100%;
        height: auto;
        cursor: pointer;
        filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.7));
        transition: transform 0.1s;
      }

      .cmd-btn:active {
        transform: scale(0.92);
      }

      #dialogue-box {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 88%;
        max-width: 500px;
        min-height: 85px;
        background: rgba(0, 0, 0, 0.9);
        border: 3px solid #ffffff;
        border-radius: 10px;
        padding: 12px 16px;
        color: #ffffff;
        z-index: 9999;
        display: none;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        box-sizing: border-box;
      }

      #speaker-name {
        font-size: 13px;
        color: #ffd700;
        font-weight: bold;
        margin-bottom: 6px;
        border-bottom: 1px solid #555;
        padding-bottom: 3px;
      }

      #subtitle-text {
        font-size: 15px;
        line-height: 1.5;
        letter-spacing: 0.5px;
      }
    </style>

    <script>
      var currentChar = null;
      var typeTimer = null;

      var charData = {
        freud: {
          name: "ジグムント・フロイト（精神分析）",
          planeId: "plane-freud",
          voices: ["snd-f1", "snd-f2", "snd-f3"],
          scripts: [
            "こんにちはなのだ。精神分析の生みの親、ジグムント・フロイト先生なのだ。オーストリアの神経学者で、心の中に隠れた無意識の存在を世に広めた、近代心理学の超大物なのだ。",
            "フロイト先生の研究は無意識の構造なのだ。心は氷山のようなもので、普段自覚できる意識は海面の上に出たほんの一部なのだ。夜に見る夢や言い間違いには、隠れた本音が潜んでいるのだ。",
            "なんでもかんでも性的な欲求に結びつけて説明したがる癖があったのだ。自分の説に少しでも反対した弟子たちを片っ端から破門にしたせいで、最後はみんな逃げ出しちゃったのだ。"
          ]
        },
        jung: {
          name: "カール・ユング（分析心理学）",
          planeId: "plane-jung",
          voices: ["snd-j1", "snd-j2", "snd-j3"],
          scripts: [
            "カール・ユング先生なのだ。スイスの精神科医で、最初はフロイト先生の一番弟子だったけれど、考え方の違いから独自に分析心理学を立ち上げた、心の深層を探求した学者なのだ。",
            "ユング先生の研究は集合的無意識なのだ。個人の経験を超えて、人類全体が神話や昔話のように共通して持っている心の底を発見したのだ。性格を外向的と内向的に分けたのも先生なのだ。",
            "心の奥底を探究しすぎて、後半はオカルトや錬金術、UFOの研究にまで本気でのめり込んじゃったのだ。言っていることが深遠すぎて、周りの学者たちをかなり困惑させたのだ。"
          ]
        },
        adler: {
          name: "アルフレッド・アドラー（個人心理学）",
          planeId: "plane-adler",
          voices: ["snd-a1", "snd-a2", "snd-a3"],
          scripts: [
            "アルフレッド・アドラー先生なのだ。オーストリア出身で個人心理学を創始したのだ。現代では嫌われる勇気という本で大ブームになって、今や3人の中で一番有名かもしれないのだ。",
            "アドラー先生の研究は目的論なのだ。過去のトラウマが原因ではなく、今持っている目的のために人は感情を使っていると説いたのだ。劣等感をバネにして人は前に進めるのだ。",
            "トラウマなんて存在しない、すべては自分の甘えだと強烈な正論で殴ってくる厳しさがあるのだ。おかげで現代では、ビジネスマン向けの自己啓発セミナーの教祖様みたいになっているのだ。"
          ]
        }
      };

      AFRAME.registerComponent('keep-aspect', {
        schema: {
          baseHeight: { type: 'number', default: 1.4 }
        },
        init: function () {
          var el = this.el;
          var baseHeight = this.data.baseHeight;

          function applyAspect() {
            var srcSelector = el.getAttribute('src');
            if (!srcSelector) return;
            var img = document.querySelector(srcSelector);
            if (img && img.naturalWidth > 0 && img.naturalHeight > 0) {
              var aspect = img.naturalWidth / img.naturalHeight;
              el.setAttribute('height', baseHeight);
              el.setAttribute('width', baseHeight * aspect);
            }
          }

          el.addEventListener('materialtextureloaded', applyAspect);
          setTimeout(applyAspect, 100);
          setTimeout(applyAspect, 600);
        }
      });

      AFRAME.registerComponent('char-marker', {
        schema: {
          charKey: { type: 'string' },
          containerId: { type: 'string' }
        },
        init: function () {
          var marker = this.el;
          var charKey = this.data.charKey;
          var containerId = this.data.containerId;

          marker.addEventListener('markerFound', function () {
            var container = document.getElementById(containerId);
            if (container) {
              container.setAttribute('scale', '0.01 0.01 0.01');
              container.removeAttribute('animation__pop');
              container.setAttribute('animation__pop', {
                property: 'scale',
                from: '0.01 0.01 0.01',
                to: '1 1 1',
                dur: 650,
                easing: 'easeOutBack'
              });
            }
            activateCharacterUI(charKey);
          });
        }
      });

      function activateCharacterUI(charKey) {
        if (currentChar !== charKey) {
          currentChar = charKey;
          var info = charData[charKey];
          document.getElementById('status-bar').innerText = "召喚中: " + info.name;
          document.getElementById('command-panel').style.display = "flex";
          document.getElementById('dialogue-box').style.display = "block";
          document.getElementById('speaker-name').innerText = info.name;
          document.getElementById('subtitle-text').innerText = "右のコマンドをタップして質問してみよう！";
        }
      }

      function setIdleAnimation(el) {
        if (!el) return;
        el.removeAttribute('animation__talkRot');
        el.setAttribute('rotation', '0 0 0');
        el.setAttribute('animation__motion', {
          property: 'scale',
          from: '1 1 1',
          to: '1.04 1.04 1',
          dir: 'alternate',
          dur: 1500,
          loop: true,
          easing: 'easeInOutSine'
        });
      }

      function selectChoice(index) {
        if (!currentChar) return;
        var info = charData[currentChar];

        var allAudios = document.querySelectorAll('audio');
        allAudios.forEach(function (aud) {
          aud.pause();
          aud.currentTime = 0;
        });
        ['plane-freud', 'plane-jung', 'plane-adler'].forEach(function (id) {
          setIdleAnimation(document.getElementById(id));
        });

        var targetAudio = document.getElementById(info.voices[index]);
        var charPlane = document.getElementById(info.planeId);

        if (targetAudio) {
          targetAudio.play();

          if (charPlane) {
            charPlane.setAttribute('animation__motion', {
              property: 'scale',
              from: '1 1 1',
              to: '1.07 1.07 1',
              dir: 'alternate',
              dur: 180,
              loop: true,
              easing: 'easeInOutQuad'
            });
            charPlane.setAttribute('animation__talkRot', {
              property: 'rotation',
              from: '0 0 -4',
              to: '0 0 4',
              dir: 'alternate',
              dur: 180,
              loop: true,
              easing: 'easeInOutSine'
            });
          }

          targetAudio.onended = function () {
            setIdleAnimation(charPlane);
          };
        }

        showSubtitle(info.scripts[index]);
      }

      function showSubtitle(text) {
        if (typeTimer) clearInterval(typeTimer);
        var subEl = document.getElementById('subtitle-text');
        subEl.innerText = "";
        var i = 0;
        typeTimer = setInterval(function () {
          if (i < text.length) {
            subEl.innerText += text.charAt(i);
            i++;
          } else {
            clearInterval(typeTimer);
          }
        }, 50);
      }
    </script>
  </head>

  <body>
    <div id="status-bar">QRコードをカメラに映して偉人を召喚しよう！</div>

    <div id="command-panel">
      <img src="balloon1.PNG" class="cmd-btn" onclick="selectChoice(0)" />
      <img src="balloon2.PNG" class="cmd-btn" onclick="selectChoice(1)" />
      <img src="balloon3.PNG" class="cmd-btn" onclick="selectChoice(2)" />
    </div>

    <div id="dialogue-box">
      <div id="speaker-name"></div>
      <div id="subtitle-text"></div>
    </div>

    <audio id="snd-f1" src="f1.mp3"></audio>
    <audio id="snd-f2" src="f2.mp3"></audio>
    <audio id="snd-f3" src="f3.mp3"></audio>
    <audio id="snd-j1" src="j1.mp3"></audio>
    <audio id="snd-j2" src="j2.mp3"></audio>
    <audio id="snd-j3" src="j3.mp3"></audio>
    <audio id="snd-a1" src="a1.mp3"></audio>
    <audio id="snd-a2" src="a2.mp3"></audio>
    <audio id="snd-a3" src="a3.mp3"></audio>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.8;" vr-mode-ui="enabled: false">
      <a-assets timeout="3000">
        <img id="img-magic" src="magic.PNG" />
        <img id="img-freud" src="freud.PNG" />
        <img id="img-jung" src="jung.PNG" />
        <img id="img-adler" src="adler.PNG" />
      </a-assets>

      <a-marker id="marker-1" type="pattern" url="marker1.patt" emitevents="true" char-marker="charKey: freud; containerId: container-1">
        <a-entity id="container-1" scale="0.01 0.01 0.01">
          <a-plane src="#img-magic" position="0 0 0" rotation="-90 0 0" width="1.6" height="1.6" material="transparent: true; alphaTest: 0.1; shader: flat; side: double;" animation="property: rotation; from: -90 0 0; to: -90 0 360; loop: true; dur: 8000; easing: linear"></a-plane>
          <a-entity position="0 0.25 0" look-at="[camera]" animation__float="property: position; from: 0 0.15 0; to: 0 0.35 0; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine">
            <a-plane id="plane-freud" src="#img-freud" keep-aspect="baseHeight: 1.4" material="transparent: true; alphaTest: 0.5; shader: flat;" animation__motion="property: scale; from: 1 1 1; to: 1.04 1.04 1; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine"></a-plane>
          </a-entity>
        </a-entity>
      </a-marker>

      <a-marker id="marker-2" type="pattern" url="marker2.patt" emitevents="true" char-marker="charKey: jung; containerId: container-2">
        <a-entity id="container-2" scale="0.01 0.01 0.01">
          <a-plane src="#img-magic" position="0 0 0" rotation="-90 0 0" width="1.6" height="1.6" material="transparent: true; alphaTest: 0.1; shader: flat; side: double;" animation="property: rotation; from: -90 0 0; to: -90 0 360; loop: true; dur: 8000; easing: linear"></a-plane>
          <a-entity position="0 0.25 0" look-at="[camera]" animation__float="property: position; from: 0 0.15 0; to: 0 0.35 0; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine">
            <a-plane id="plane-jung" src="#img-jung" keep-aspect="baseHeight: 1.4" material="transparent: true; alphaTest: 0.5; shader: flat;" animation__motion="property: scale; from: 1 1 1; to: 1.04 1.04 1; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine"></a-plane>
          </a-entity>
        </a-entity>
      </a-marker>

      <a-marker id="marker-3" type="pattern" url="marker3.patt" emitevents="true" char-marker="charKey: adler; containerId: container-3">
        <a-entity id="container-3" scale="0.01 0.01 0.01">
          <a-plane src="#img-magic" position="0 0 0" rotation="-90 0 0" width="1.6" height="1.6" material="transparent: true; alphaTest: 0.1; shader: flat; side: double;" animation="property: rotation; from: -90 0 0; to: -90 0 360; loop: true; dur: 8000; easing: linear"></a-plane>
          <a-entity position="0 0.25 0" look-at="[camera]" animation__float="property: position; from: 0 0.15 0; to: 0 0.35 0; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine">
            <a-plane id="plane-adler" src="#img-adler" keep-aspect="baseHeight: 1.4" material="transparent: true; alphaTest: 0.5; shader: flat;" animation__motion="property: scale; from: 1 1 1; to: 1.04 1.04 1; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine"></a-plane>
          </a-entity>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
