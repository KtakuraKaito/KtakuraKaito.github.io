<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Psychology 3-Choice AR</title>
    <!-- 基本のA-FrameとAR.js -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- ビルボード（常にカメラを向く）機能を追加する拡張スクリプト -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script>
      AFRAME.registerComponent('choice-button', {
        schema: {
          audioId: { type: 'string' },
          markerId: { type: 'string' }
        },
        init: function () {
          var el = this.el;
          var audioId = this.data.audioId;
          var markerId = this.data.markerId;
          var marker = document.getElementById(markerId);
          var isMarkerVisible = false;

          marker.addEventListener('markerFound', function () {
            isMarkerVisible = true;
          });
          marker.addEventListener('markerLost', function () {
            isMarkerVisible = false;
          });

          el.addEventListener('click', function (evt) {
            if (!isMarkerVisible) return;
            if (evt.stopPropagation) evt.stopPropagation();

            var allAudios = document.querySelectorAll('audio');
            allAudios.forEach(function (aud) {
              aud.pause();
              aud.currentTime = 0;
            });

            var targetAudio = document.getElementById(audioId);
            if (targetAudio) {
              targetAudio.play();
            }

            el.setAttribute('animation', {
              property: 'scale',
              to: '0.85 0.85 0.85',
              dur: 100,
              dir: 'alternate',
              loop: 2
            });
          });
        }
      });

      AFRAME.registerComponent('pop-animator', {
        schema: {
          targetId: { type: 'string' }
        },
        init: function () {
          var marker = this.el;
          var targetId = this.data.targetId;

          marker.addEventListener('markerFound', function () {
            var target = document.getElementById(targetId);
            if (target) {
              target.setAttribute('scale', '0 0 0');
              target.removeAttribute('animation');
              target.setAttribute('animation', {
                property: 'scale',
                from: '0 0 0',
                to: '1 1 1',
                dur: 700,
                easing: 'easeOutElastic'
              });
            }
          });

          marker.addEventListener('markerLost', function () {
            var target = document.getElementById(targetId);
            if (target) {
              target.setAttribute('scale', '0 0 0');
            }
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <audio id="snd-f1" src="f1.mp3"></audio>
    <audio id="snd-f2" src="f2.mp3"></audio>
    <audio id="snd-f3" src="f3.mp3"></audio>
    <audio id="snd-j1" src="j1.mp3"></audio>
    <audio id="snd-j2" src="j2.mp3"></audio>
    <audio id="snd-j3" src="j3.mp3"></audio>
    <audio id="snd-a1" src="a1.mp3"></audio>
    <audio id="snd-a2" src="a2.mp3"></audio>
    <audio id="snd-a3" src="a3.mp3"></audio>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.8;" vr-mode-ui="enabled: false">
      <a-assets timeout="3000">
        <img id="img-freud" src="freud.PNG" />
        <img id="img-jung" src="jung.PNG" />
        <img id="img-adler" src="adler.PNG" />
        <!-- コマンドウィンドウ風の四角いボタン画像に変更を推奨 -->
        <img id="btn-1" src="balloon1.PNG" />
        <img id="btn-2" src="balloon2.PNG" />
        <img id="btn-3" src="balloon3.PNG" />
      </a-assets>

      <!-- 1人目：フロイト -->
      <a-marker id="marker-1" type="pattern" url="marker1.patt" emitevents="true" pop-animator="targetId: container-1">
        <!-- コンテナ全体に look-at="[camera]" を追加し、常にカメラへ向ける -->
        <a-entity id="container-1" scale="0 0 0" look-at="[camera]">
          <!-- 人物画像の rotation を 0 0 0 に変更し、垂直に立てる -->
          <a-plane src="#img-freud" position="-0.5 0 0" rotation="0 0 0" width="1.2" height="1.2" material="transparent: true; alphaTest: 0.5; shader: flat;"></a-plane>
          
          <!-- ボタン群（RPGのコマンドのように縦に等間隔で整列） -->
          <a-plane src="#btn-1" position="0.7 0.45 0" rotation="0 0 0" width="1.1" height="0.35" material="transparent: true; alphaTest: 0.5; shader: flat;" class="clickable" choice-button="audioId: snd-f1; markerId: marker-1"></a-plane>
          <a-plane src="#btn-2" position="0.7 0 0" rotation="0 0 0" width="1.1" height="0.35" material="transparent: true; alphaTest: 0.5; shader: flat;" class="clickable" choice-button="audioId: snd-f2; markerId: marker-1"></a-plane>
          <a-plane src="#btn-3" position="0.7 -0.45 0" rotation="0 0 0" width="1.1" height="0.35" material="transparent: true; alphaTest: 0.5; shader: flat;" class="clickable" choice-button="audioId: snd-f3; markerId: marker-1"></a-plane>
        </a-entity>
      </a-marker>

      <!-- 2人目：ユング -->
      <a-marker id="marker-2" type="pattern" url="marker2.patt" emitevents="true" pop-animator="targetId: container-2">
        <a-entity id="container-2" scale="0 0 0" look-at="[camera]">
          <a-plane src="#img-jung" position="-0.5 0 0" rotation="0 0 0" width="1.2" height="1.2" material="transparent: true; alphaTest: 0.5; shader: flat;"></a-plane>
          <a-plane src="#btn-1" position="0.7 0.45 0" rotation="0 0 0" width="1.1" height="0.35" material="transparent: true; alphaTest: 0.5; shader: flat;" class="clickable" choice-button="audioId: snd-j1; markerId: marker-2"></a-plane>
          <a-plane src="#btn-2" position="0.7 0 0" rotation="0 0 0" width="1.1" height="0.35" material="transparent: true; alphaTest: 0.5; shader: flat;" class="clickable" choice-button="audioId: snd-j2; markerId: marker-2"></a-plane>
          <a-plane src="#btn-3" position="0.7 -0.45 0" rotation="0 0 0" width="1.1" height="0.35" material="transparent: true; alphaTest: 0.5; shader: flat;" class="clickable" choice-button="audioId: snd-j3; markerId: marker-2"></a-plane>
        </a-entity>
      </a-marker>

      <!-- 3人目：アドラー -->
      <a-marker id="marker-3" type="pattern" url="marker3.patt" emitevents="true" pop-animator="targetId: container-3">
        <a-entity id="container-3" scale="0 0 0" look-at="[camera]">
          <a-plane src="#img-adler" position="-0.5 0 0" rotation="0 0 0" width="1.2" height="1.2" material="transparent: true; alphaTest: 0.5; shader: flat;"></a-plane>
          <a-plane src="#btn-1" position="0.7 0.45 0" rotation="0 0 0" width="1.1" height="0.35" material="transparent: true; alphaTest: 0.5; shader: flat;" class="clickable" choice-button="audioId: snd-a1; markerId: marker-3"></a-plane>
          <a-plane src="#btn-2" position="0.7 0 0" rotation="0 0 0" width="1.1" height="0.35" material="transparent: true; alphaTest: 0.5; shader: flat;" class="clickable" choice-button="audioId: snd-a2; markerId: marker-3"></a-plane>
          <a-plane src="#btn-3" position="0.7 -0.45 0" rotation="0 0 0" width="1.1" height="0.35" material="transparent: true; alphaTest: 0.5; shader: flat;" class="clickable" choice-button="audioId: snd-a3; markerId: marker-3"></a-plane>
        </a-entity>
      </a-marker>

      <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-scene>
  </body>
</html>
