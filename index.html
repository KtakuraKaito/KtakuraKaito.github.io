<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Freud WebAR</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
      AFRAME.registerComponent('sound-trigger', {
        init: function () {
          var targetEl = this.el;
          targetEl.addEventListener('click', function () {
            var sound = document.querySelector('#voice');
            if (sound) {
              sound.currentTime = 0;
              sound.play();
            }
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="patternRatio: 0.8;" vr-mode-ui="enabled: false">
      <a-assets>
        <img id="freud-img" src="freud.png" />
        <audio id="voice" src="freud_intro.mp3" preload="auto"></audio>
      </a-assets>

      <a-marker type="pattern" url="marker.patt">
        <a-plane
          src="#freud-img"
          position="0 0 0"
          rotation="-90 0 0"
          width="1.5"
          height="1.5"
          material="transparent: true; alphaTest: 0.5; shader: flat;"
          class="clickable"
          sound-trigger>
        </a-plane>
      </a-marker>

      <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-scene>
  </body>
</html>
